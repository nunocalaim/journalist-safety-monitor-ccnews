name: Journalist Safety Monitoring (CC-NEWS)
on:
  # Re-enabled 2026-10-09 (see PLAN.md's (19) entry): the account's 100%
  # Git LFS block (entry 18) turned out to persist for the rest of the
  # billing cycle regardless of usage reduction -- deleting the old repo
  # didn't lift it. Fixed properly instead: rewrote this repo's history
  # (git filter-repo) to drop 122 superseded data/incidents.db versions
  # (48.8GB of dead weight from every pre-split push re-uploading the whole
  # file), deleted and recreated the GitHub repo to actually reclaim that
  # storage, and raised the Git LFS budget to a small capped amount ($5)
  # so pushes aren't blocked for the rest of this cycle. Current account
  # usage is back down to just the ~665MB actually needed. Re-check the
  # budget around 2026-11-01 -- lower it back to $0 if the per-month
  # split's bounded growth (a few MB/push) makes the ongoing cost
  # negligible enough not to need headroom, or leave it if small bounded
  # spend is fine going forward.
  schedule:
    # Offset from the GDELT repo's 0,6,12,18 cron so the two don't collide.
    # 4 runs/day x shard_count=4 x max_warc_files_per_run=1 processes ~4
    # CC-NEWS WARC files/day, matching CC-NEWS's own ~16 files/day / 4
    # shards publication rate -- see config.yaml's ccnews_collection.
    - cron: '15 1,7,13,19 * * *'
  workflow_dispatch:
    inputs:
      shard_index:
        description: 'Zero-based CC-NEWS WARC file shard to run'
        required: false
        default: ''
jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          lfs: false

      - name: Fetch only the Git LFS files this run needs
        run: |
          # data/candidates/candidates_YYYY-MM.db is one file per month
          # (see PLAN.md's 2026-09-22 entry / database.py) -- `checkout`'s
          # own `lfs: true` would pull EVERY month's file on every run,
          # which would make checkout bandwidth grow without bound as
          # months accumulate, defeating the point of splitting them out.
          # Pull just incidents.db plus the current + previous month's
          # candidates file (the widest window any rolling export needs)
          # on most runs; the day's first run (hour 1, matching this
          # workflow's own cron) additionally pulls every month so
          # candidates_full.csv can be regenerated with true full history
          # at least once a day, not committed stale forever.
          # checkout's own lfs:true would also register the LFS git
          # filters -- since that's skipped here (lfs: false above), do it
          # explicitly so `git lfs pull` below has something to smudge with.
          git lfs install --local
          HOUR=$(date -u +%H)
          CURRENT_MONTH=$(date -u +%Y-%m)
          PREVIOUS_MONTH=$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m)
          if [ "$((10#$HOUR))" -eq 1 ]; then
            echo "First run of the day -- pulling all candidates months"
            echo "FULL_CANDIDATES_PULL=1" >> "$GITHUB_ENV"
            git lfs pull --include="data/incidents.db,data/candidates/*.db"
          else
            echo "FULL_CANDIDATES_PULL=0" >> "$GITHUB_ENV"
            git lfs pull --include="data/incidents.db,data/candidates/candidates_${CURRENT_MONTH}.db,data/candidates/candidates_${PREVIOUS_MONTH}.db"
          fi

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run monitoring system
        run: |
          if [ -n "${{ github.event.inputs.shard_index }}" ]; then
            SHARD_INDEX="${{ github.event.inputs.shard_index }}"
          else
            SHARD_INDEX=$((10#$(date -u +%H) / 6))
          fi
          echo "Running CC-NEWS shard ${SHARD_INDEX}/4"
          SKIP_FULL_FLAG=""
          if [ "$FULL_CANDIDATES_PULL" != "1" ]; then
            SKIP_FULL_FLAG="--skip-full-candidates-export"
          fi
          python journalist_safety_monitor.py --shard-count 4 --shard-index "${SHARD_INDEX}" ${SKIP_FULL_FLAG}

      - name: Commit and push results
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          mkdir -p reports alerts data/exports data/candidates
          git add reports alerts data/incidents.db data/candidates data/exports data/ccnews_state.json
          git diff --staged --quiet || git commit -m "Update monitoring data"
          # No "|| echo" fallback here on purpose (found 2026-09-22): git
          # push already exits 0 when there's simply nothing new to push
          # (the commit above is a no-op), so a non-zero exit here is a
          # REAL failure -- and swallowing it silently is exactly how a
          # Git LFS quota outage went unnoticed for ~24h of scheduled runs,
          # each showing green in Actions while quietly discarding that
          # run's collected data. Let it fail the job loudly instead.
          git push
