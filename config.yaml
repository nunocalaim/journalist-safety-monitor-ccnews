# Journalist Safety Monitoring (Common Crawl News) - Configuration

# Monitoring parameters
lookback_days: 1  # CC-NEWS ships new WARC files every ~2-3 hours; no need for GDELT's 7-day lookback
update_frequency: "daily"  # Options: daily, weekly, manual

# Alert thresholds (unchanged from the GDELT-based repo)
alert_thresholds:
  critical:
    - "killed"
    - "murder"
    - "death"
    - "fatal"
    - "assassination"
  high:
    - "attack"
    - "assault"
    - "injured"
    - "detained"
    - "arrest"
    - "kidnapped"
  medium:
    - "threat"
    - "intimidation"
    - "harassment"
    - "censorship"

# High-priority countries (higher journalist risk) - unchanged from the GDELT-based repo
priority_countries:
  critical:
    - "MX"  # Mexico
    - "AF"  # Afghanistan
    - "SY"  # Syria
    - "IQ"  # Iraq
    - "SO"  # Somalia
  high:
    - "PK"  # Pakistan
    - "IN"  # India
    - "PH"  # Philippines
    - "BR"  # Brazil
    - "TR"  # Turkey
    - "EG"  # Egypt
    - "RU"  # Russia
    - "CN"  # China
    - "SA"  # Saudi Arabia
    - "IR"  # Iran
  medium:
    - "US"
    - "UK"
    - "FR"
    - "DE"
    - "ES"
    - "IT"

# News sources by country, classified by source type -- see PLAN.md's
# 2026-08-24 update for how this was derived; expanded 2026-08-25 using
# scripts/discover_sources.py against scripts/candidate_domains.txt, a list
# researched for geographic, geopolitical, and media-bias diversity (state
# media alongside independent/exile media in restricted-press countries).
#
# source: ccnews  -- allowed by robots.txt (not CCBot-blocked). Some of
#   these (economictimes, haberler, kommersant, meduza, arabnews, irna,
#   finanznachrichten) were separately confirmed actually present in a
#   sample of real CC-NEWS WARC files; the rest are only confirmed
#   *allowed*, not yet confirmed *actually crawled* by CC-NEWS (it only
#   crawls a curated source list Common Crawl doesn't publish) -- treat
#   these as eligible-but-unproven until production runs show real matches.
#   UNLIKE gdelt_queries in the GDELT-based repo, this is NOT a search
#   filter -- every WARC file is downloaded and scanned in full regardless
#   of this list; it only decides which of the scanned records get kept.
#
# source: rss -- blocks CCBot in robots.txt (or robots.txt was unreachable,
#   noted per-entry below), so can never appear in CC-NEWS, but publishes a
#   working public RSS/Atom feed (confirmed parseable with feedparser).
#   fetch_full_text: true means that domain's robots.txt confirmed a
#   generic (non-CCBot) user agent is allowed, so RSSCollector fetches the
#   article page for full-text validation, not just the feed summary;
#   false means either confirmed blocked for a generic agent too, or
#   robots.txt was unreachable so it's left conservative (summary only).
ccnews_domains:
  MX:
    - domain: "www.jornada.com.mx"
      source: "rss"
      feed_url: "https://www.jornada.com.mx/rss/edicion.xml"
      fetch_full_text: true
    - domain: "www.reforma.com"
      source: "rss"
      feed_url: "https://www.reforma.com/rss/portada.xml"
      fetch_full_text: false  # robots.txt unreachable; heavily paywalled
    - domain: "www.eluniversal.com.mx"
